name: Kettle Thorn verification
on:
  push:
    branches: [indie-collection-three-dev]
    paths: ['games/kettle-thorn/**', 'tests/kettle-thorn-*', '.github/workflows/kettle-thorn-verification.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --prefix "$RUNNER_TEMP/qa" playwright@1.58.2
          node "$RUNNER_TEMP/qa/node_modules/playwright/cli.js" install --with-deps chromium
      - run: |
          export NODE_PATH="$RUNNER_TEMP/qa/node_modules"
          node --check games/kettle-thorn/game.js
          node --test tests/kettle-thorn-engine.cjs
          node tests/kettle-thorn-browser.cjs
          node tests/kettle-thorn-shell.cjs
          python tests/assets.py
          python tests/selected-indie.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kettle-thorn-browser
          path: test-artifacts/kettle-thorn/




