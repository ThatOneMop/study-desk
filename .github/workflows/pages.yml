name: Build and publish Study Desk
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: study-desk-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore complete game sources once
        if: ${{ hashFiles('.bootstrap/installed') == '' }}
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/website.zip.[0-9][0-9][0-9] > "$RUNNER_TEMP/website.zip"
          echo "2f4c7f94ee2e499a63b4e2d59b54379ab50ece39e7ad3149c007dbf17845c39b  $RUNNER_TEMP/website.zip" | sha256sum -c -
          echo "01175d4924736434961fedb7d15cb29068ed35a07939755a41f049a1cca06bb1  .bootstrap/latest.zip" | sha256sum -c -
          unzip -oq "$RUNNER_TEMP/website.zip" -d .
          unzip -oq .bootstrap/latest.zip -d .
          echo '100-game collection restored; Gummy Bay v17 included.' > .bootstrap/installed
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .nojekyll README.md SOURCE_VERSIONS.json TEST_REPORT.md app.js bridge.js catalog.js catalog.json credits.html doom-engine-source.zip games hextris-source.zip index.html style.css tests GUMMY_BAY_UPDATE.md .bootstrap/installed
          if ! git diff --cached --quiet; then
            git commit -m 'Restore 100-game collection and Gummy Bay v17 [skip ci]'
            git push origin HEAD:main
          fi
      - name: Verify game routes and local assets
        run: python tests/assets.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare static website
        run: |
          mkdir -p "$RUNNER_TEMP/study-desk"
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='.bootstrap/' ./ "$RUNNER_TEMP/study-desk/"
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/study-desk
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
