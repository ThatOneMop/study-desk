name: Foldlight catalogue promotion
on:
  push:
    branches: [foldlight-release]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  foldlight-catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --prefix "$RUNNER_TEMP/qa" jsdom@26.1.0 playwright@1.58.2
          node "$RUNNER_TEMP/qa/node_modules/playwright/cli.js" install --with-deps chromium
      - run: |
          export NODE_PATH="$RUNNER_TEMP/qa/node_modules"
          node --test tests/foldlight-engine.cjs tests/foldlight-dom.cjs
          node tests/foldlight-browser.cjs
          node tests/foldlight-catalog-browser.cjs
          node tests/curation-regression.cjs
          node tests/active-credits.cjs
          node tests/catalog-launch.cjs
          node tests/launcher-navigation.cjs
          node tests/relaxed-collection.cjs
          python tests/assets.py
          python tests/selected-indie.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foldlight-catalogue-browser
          path: |
            test-artifacts/foldlight/
            test-artifacts/foldlight-catalog/
