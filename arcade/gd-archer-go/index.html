<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Archer Go · Study Desk Arcade</title>
<link rel="icon" href="../../favicon.ico" sizes="32x32">
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#0f1d18;color:#e6eee2;overflow:hidden}
.bar{height:44px;display:flex;align-items:center;gap:8px;padding:4px 8px;background:#172b23;border-bottom:1px solid #2c4337}
.bar button{font:inherit;font-size:13px;color:#e6eee2;background:#22392e;border:1px solid #3d574a;border-radius:8px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.bar button:hover{background:#2f4b3c}.bar button:focus-visible{outline:3px solid #d4b26b;outline-offset:2px}
.who{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.who b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who small{font-size:11px;color:#a9b9a3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who a{color:#c9d9a9}
#stage{position:relative;width:100%;height:calc(100% - 44px);background:#000}
#stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
#stage:fullscreen{height:100%}#stage:-webkit-full-screen{height:100%}
.off{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;background:#13231c}
.off img{width:min(360px,80vw);border-radius:12px;opacity:.75}.off p{max-width:520px;line-height:1.6;color:#c4d1bc;margin:0}
@media(max-width:480px){.bar button{padding:6px 9px;font-size:12px}.who small{display:none}}
</style>
</head>
<body>
<div class="bar">
 <button type="button" id="back" aria-label="Back to Study Desk games">← Back</button>
 <div class="who"><b id="title">Archer Go</b><small id="credit"></small></div>
 <button type="button" id="fs" aria-label="Play fullscreen">⛶ Fullscreen</button>
</div>
<div id="stage" data-kind="gd"></div>
<script id="game-data" type="application/json">{"id": "gd-archer-go", "title": "Archer Go", "developer": "Inlogic Software", "source": "GameDistribution", "sourcePage": "https://gamedistribution.com/games/archer-go/", "thumbnail": "https://img.gamedistribution.com/bcbd1517d72f430a81c903116126cbfd-512x384.jpg", "description": "Archery challenges: judge wind and distance to hit the targets.", "controls": "The game features simple and intuitive controls: tap, hold and release to shoot arrows. Your goal is to aim precisely and hit the target. As you play, you can u", "gdGameId": "bcbd1517d72f430a81c903116126cbfd"}</script>
<script src="../../arcade-config.js"></script>
<script src="../../bridge.js"></script>
<script>
(()=>{'use strict';
const g=JSON.parse(document.getElementById('game-data').textContent),stage=document.getElementById('stage'),kind=stage.dataset.kind;
const credit=document.getElementById('credit');
credit.append('by '+g.developer+' · via ');const link=document.createElement('a');link.href=g.sourcePage;link.target='_blank';link.rel='noopener';link.textContent=g.source;credit.append(link,' · ads are shown by the game');
const cfg=window.ARCADE_CONFIG||{};
function frame(src){const f=document.createElement('iframe');f.src=src;f.title=g.title+' game';f.allow='autoplay; fullscreen; gamepad; accelerometer; gyroscope';f.setAttribute('allowfullscreen','');f.setAttribute('scrolling','no');stage.append(f);return f}
function off(msg){const box=document.createElement('div');box.className='off';const img=document.createElement('img');img.src=g.thumbnail;img.alt='';const p=document.createElement('p');p.textContent=msg;box.append(img,p);stage.append(box)}
if(kind==='gm'){frame(g.embed)}
else if(cfg.gdEnabled===true&&typeof cfg.gdPublisherId==='string'&&cfg.gdPublisherId.trim()){
 frame('https://html5.gamedistribution.com/'+encodeURIComponent(g.gdGameId)+'/?gd_sdk_referrer_url='+encodeURIComponent(location.href.split('#')[0]))}
else off(g.title+' is not switched on yet. It needs an approved GameDistribution publisher account first.');
document.getElementById('back').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});
 if(window.parent!==window){try{window.parent.postMessage({type:'study-collection'},location.origin);return}catch{}}
 location.href='../../index.html#games'};
const fs=document.getElementById('fs');
fs.onclick=()=>{const d=document;if(d.fullscreenElement||d.webkitFullscreenElement){(d.exitFullscreen||d.webkitExitFullscreen).call(d);return}
 const req=stage.requestFullscreen||stage.webkitRequestFullscreen;if(req){const r=req.call(stage);if(r&&r.catch)r.catch(()=>{fs.textContent='Fullscreen blocked'})}else fs.textContent='Fullscreen unavailable'};
document.addEventListener('fullscreenchange',()=>{fs.textContent=document.fullscreenElement?'✕ Exit fullscreen':'⛶ Fullscreen'});
})();
</script>
</body>
</html>
