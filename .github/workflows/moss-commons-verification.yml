name: Moss Commons candidate verification
on:
  push:
    branches: [indie-collection-three-dev]
    paths:
      - 'games/moss-commons/**'
      - 'tests/moss-commons*'
      - 'tests/fixtures/moss-commons*'
      - '.github/workflows/moss-commons-verification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  moss-commons:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --prefix "$RUNNER_TEMP/qa" jsdom@26.1.0 playwright@1.58.2
          node "$RUNNER_TEMP/qa/node_modules/playwright/cli.js" install --with-deps chromium
      - run: |
          export NODE_PATH="$RUNNER_TEMP/qa/node_modules"
          node --check games/moss-commons/game.js
          node --test tests/moss-commons-engine.cjs tests/moss-commons-dom.cjs
          node tests/moss-commons-browser.cjs
          python tests/assets.py
          python tests/selected-indie.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moss-commons-browser
          path: test-artifacts/moss-commons/

