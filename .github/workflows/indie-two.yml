name: Second indie collection regression
on:
  push:
    branches: [indie-collection-two-dev]
    paths:
      - 'games/reefwright/**'
      - 'games/counterweight/**'
      - 'games/lanternwake/**'
      - 'games/copper-cadence/**'
      - 'games/hollow-keeper/**'
      - 'games/paper-odyssey/**'
      - 'games/wellward/**'
      - 'tests/wellward-*'
      - 'tests/fixtures/wellward-*'
      - 'games/ratchet-run/**'
      - 'tests/ratchet-run-*'
      - 'tests/fixtures/ratchet-run-*'
      - 'tests/paper-odyssey-*'
      - 'tests/fixtures/paper-odyssey-*'
      - 'tests/hollow-keeper-*'
      - 'tests/fixtures/hollow-keeper-*'
      - 'tests/copper-cadence-*'
      - 'tests/fixtures/copper-cadence-*'
      - 'tests/lanternwake-*'
      - 'tests/fixtures/lanternwake-*'
      - 'tests/counterweight-*'
      - 'tests/fixtures/counterweight-*'
      - 'dev/indie-collection-two/**'
      - 'tests/reefwright-*'
      - 'tests/fixtures/reefwright-*'
      - 'tests/indie-two-gate.py'
      - '.github/workflows/indie-two.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: indie-two-${{ github.ref }}
  cancel-in-progress: false
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve public routes and first-batch source hashes
        run: |
          python tests/assets.py
          python tests/selected-indie.py
          python tests/indie-two-gate.py
          node --check games/reefwright/engine.js
          node --check games/reefwright/game.js
          node --check games/counterweight/engine.js
          node --check games/counterweight/game.js
          node --check games/lanternwake/engine.js
          node --check games/lanternwake/game.js
          node --check games/copper-cadence/engine.js
          node --check games/copper-cadence/game.js
          node --check games/hollow-keeper/engine.js
          node --check games/hollow-keeper/game.js
          node --check games/paper-odyssey/engine.js
          node --check games/paper-odyssey/game.js
          node --check games/ratchet-run/engine.js
          node --check games/ratchet-run/game.js
          node --check games/wellward/engine.js
          node --check games/wellward/game.js
      - name: Engine and full campaign checks
        run: node --test tests/reefwright-engine.cjs tests/counterweight-engine.cjs tests/lanternwake-engine.cjs tests/copper-cadence-engine.cjs tests/hollow-keeper-engine.cjs tests/paper-odyssey-engine.cjs tests/ratchet-run-engine.cjs tests/wellward-engine.cjs
      - name: Install test-only dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/reef-deps" jsdom@26.1.0 playwright@1.58.2
          node "$RUNNER_TEMP/reef-deps/node_modules/playwright/cli.js" install --with-deps chromium
      - name: DOM, persistence and input checks
        run: NODE_PATH="$RUNNER_TEMP/reef-deps/node_modules" node --test tests/reefwright-dom.cjs tests/counterweight-dom.cjs tests/lanternwake-dom.cjs tests/copper-cadence-dom.cjs tests/hollow-keeper-dom.cjs tests/paper-odyssey-dom.cjs tests/ratchet-run-dom.cjs tests/wellward-dom.cjs
      - name: Desktop and touch Chromium campaigns
        run: |
          NODE_PATH="$RUNNER_TEMP/reef-deps/node_modules" node tests/wellward-browser.cjs
          NODE_PATH="$RUNNER_TEMP/reef-deps/node_modules" node tests/ratchet-run-browser.cjs
          NODE_PATH="$RUNNER_TEMP/reef-deps/node_modules" node tests/reefwright-browser.cjs
          NODE_PATH="$RUNNER_TEMP/reef-deps/node_modules" node tests/counterweight-browser.cjs
          NODE_PATH="$RUNNER_TEMP/reef-deps/node_modules" node tests/lanternwake-browser.cjs
          NODE_PATH="$RUNNER_TEMP/reef-deps/node_modules" node tests/copper-cadence-browser.cjs
          NODE_PATH="$RUNNER_TEMP/reef-deps/node_modules" node tests/hollow-keeper-browser.cjs
          NODE_PATH="$RUNNER_TEMP/reef-deps/node_modules" node tests/paper-odyssey-browser.cjs
      - name: Preserve browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: second-batch-browser-screenshots
          path: test-artifacts/
          if-no-files-found: warn
