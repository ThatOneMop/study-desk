name: Second collection promotion regression
on:
  push:
    branches: [indie-two-promotion]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  selected-games:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          python tests/assets.py
          python tests/selected-indie.py
          npm install --prefix "$RUNNER_TEMP/qa" jsdom@26.1.0 playwright@1.58.2
          node "$RUNNER_TEMP/qa/node_modules/playwright/cli.js" install --with-deps chromium
      - run: |
          export NODE_PATH="$RUNNER_TEMP/qa/node_modules"
          node --test tests/hollow-keeper-engine.cjs tests/hollow-keeper-dom.cjs tests/cairn-and-cord-engine.cjs tests/cairn-and-cord-dom.cjs tests/murmuration-engine.cjs tests/murmuration-dom.cjs
          node --test tests/counterweight-engine.cjs tests/counterweight-dom.cjs
          node tests/counterweight-browser.cjs
          node --test tests/tea-for-ghosts-engine.cjs tests/tea-for-ghosts-dom.cjs
          node tests/tea-for-ghosts-browser.cjs
          node --test tests/copper-cadence-engine.cjs tests/copper-cadence-dom.cjs
          node tests/copper-cadence-browser.cjs
          node --test tests/wellward-engine.cjs tests/wellward-dom.cjs
          node tests/wellward-browser.cjs
          node --test tests/reefwright-engine.cjs tests/reefwright-dom.cjs tests/reefwright-dialog-focus.cjs
          node tests/reefwright-browser.cjs
          node tests/curation-regression.cjs
          node tests/hollow-keeper-browser.cjs
          node tests/cairn-and-cord-browser.cjs
          node tests/murmuration-browser.cjs
          node tests/murmuration-bridge.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selected-games-browser
          path: test-artifacts/
