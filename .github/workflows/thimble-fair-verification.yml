name: Thimble Fair verification
on:
  push:
    branches: [indie-collection-three-dev]
    paths: ['games/thimble-fair/**', 'tests/thimble-fair-*.cjs', '.github/workflows/thimble-fair-verification.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --prefix "$RUNNER_TEMP/qa" jsdom@26.1.0 playwright@1.58.2
          node "$RUNNER_TEMP/qa/node_modules/playwright/cli.js" install --with-deps chromium
      - run: |
          export NODE_PATH="$RUNNER_TEMP/qa/node_modules"
          node --check games/thimble-fair/game.js
          node --test tests/thimble-fair-engine.cjs tests/thimble-fair-dom.cjs
          node tests/thimble-fair-browser.cjs
          python tests/assets.py
          python tests/selected-indie.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thimble-fair-browser
          path: test-artifacts/thimble-fair/
