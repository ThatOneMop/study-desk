name: Bough Balance verification
on:
  push:
    branches: [indie-collection-three-dev, bough-balance-release-20261102]
    paths: ['app.js', 'catalog.json', 'favicon.ico', 'games/bough-balance/**', 'tests/bough-balance-*', '.github/workflows/bough-balance-verification.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --prefix "$RUNNER_TEMP/qa" jsdom@26.1.0 playwright@1.58.2
          node "$RUNNER_TEMP/qa/node_modules/playwright/cli.js" install --with-deps chromium
      - run: |
          export NODE_PATH="$RUNNER_TEMP/qa/node_modules"
          node --check games/bough-balance/game.js
          node --test tests/bough-balance-engine.cjs tests/bough-balance-dom.cjs
          node tests/bough-balance-browser.cjs
          node tests/bough-balance-catalog-browser.cjs
          node tests/catalog-launch.cjs
          python tests/assets.py
          python tests/selected-indie.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bough-balance-browser
          path: |
            test-artifacts/bough-balance/
            test-artifacts/bough-balance-catalog/
