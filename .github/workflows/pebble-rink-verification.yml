name: Pebble Rink candidate verification
on:
  push:
    branches: [indie-collection-three-dev]
    paths:
      - 'games/pebble-rink/**'
      - 'tests/pebble-rink*'
      - '.github/workflows/pebble-rink-verification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pebble-rink:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --prefix "$RUNNER_TEMP/qa" jsdom@26.1.0 playwright@1.58.2
          node "$RUNNER_TEMP/qa/node_modules/playwright/cli.js" install --with-deps chromium
      - run: |
          export NODE_PATH="$RUNNER_TEMP/qa/node_modules"
          node --check games/pebble-rink/game.js
          node --test tests/pebble-rink-engine.cjs tests/pebble-rink-dom.cjs
          node tests/pebble-rink-browser.cjs
          python tests/assets.py
          python tests/selected-indie.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pebble-rink-browser
          path: test-artifacts/pebble-rink/
