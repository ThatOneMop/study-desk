name: Mycelium Yard verification
on:
  push:
    branches: [indie-collection-three-dev]
    paths: ['games/mycelium-yard/**', 'tests/mycelium-yard-*', '.github/workflows/mycelium-yard-verification.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --prefix "$RUNNER_TEMP/qa" playwright@1.58.2
          node "$RUNNER_TEMP/qa/node_modules/playwright/cli.js" install --with-deps chromium
      - run: |
          export NODE_PATH="$RUNNER_TEMP/qa/node_modules"
          node --check games/mycelium-yard/game.js
          node --test tests/mycelium-yard-engine.cjs
          node tests/mycelium-yard-browser.cjs
          node tests/mycelium-yard-qualification.cjs
          python tests/assets.py
          python tests/selected-indie.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mycelium-yard-browser
          path: test-artifacts/mycelium-yard/
