<!doctype html><meta name="viewport" content="width=device-width"><title>Reedbreaker shell fixture</title><button id="hide">Hide game</button><button id="show">Show game</button><p id="returned">Game open</p><iframe title="Reedbreaker" style="width:100%;height:900px;border:0" src="../../games/reedbreaker/index.html"></iframe><script>const f=document.querySelector('iframe');hide.onclick=()=>f.contentWindow.postMessage({type:'study-visibility',visible:false},location.origin);show.onclick=()=>f.contentWindow.postMessage({type:'study-visibility',visible:true},location.origin);addEventListener('message',e=>{if(e.source===f.contentWindow&&e.origin===location.origin&&e.data?.type==='study-collection')document.querySelector('#returned').textContent='Collection requested'});</script>
