name: Soundings concurrent-main merge verification
on:
  push:
    branches: [indie-three-soundings-merge]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  soundings:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --prefix "$RUNNER_TEMP/qa" jsdom@26.1.0 playwright@1.58.2
          node "$RUNNER_TEMP/qa/node_modules/playwright/cli.js" install --with-deps chromium
      - run: |
          export NODE_PATH="$RUNNER_TEMP/qa/node_modules"
          node --check games/soundings/game.js
          node --test tests/soundings-engine.cjs tests/soundings-dom.cjs
          node tests/soundings-browser.cjs
          node tests/soundings-catalog-browser.cjs
          node tests/curation-regression.cjs
          node tests/lanewright-smoke.cjs
          python tests/assets.py
          python tests/selected-indie.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soundings-merge-browser
          path: |
            test-artifacts/soundings/
            test-artifacts/soundings-catalog/

