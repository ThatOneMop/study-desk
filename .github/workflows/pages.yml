name: Build and publish Study Desk
# This job publishes an existing GitHub Pages site. It does not create one.
# Settings → Pages → Source must be GitHub Actions before a run can deploy.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: study-desk-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify game routes and local assets
        run: |
          python tests/assets.py
          python tests/selected-indie.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare static website
        run: |
          mkdir -p "$RUNNER_TEMP/study-desk"
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='.bootstrap/' --exclude='games/gummy-bay-dev/' ./ "$RUNNER_TEMP/study-desk/"
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/study-desk
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
