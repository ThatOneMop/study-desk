name: Bramble Pact verification
on:
  push:
    branches: [indie-collection-three-dev]
    paths: ['games/bramble-pact/**', 'tests/bramble-pact-*.cjs', '.github/workflows/bramble-pact-verification.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix "$RUNNER_TEMP/qa" jsdom@26.1.0
      - run: |
          export NODE_PATH="$RUNNER_TEMP/qa/node_modules"
          node --check games/bramble-pact/game.js
          node --test tests/bramble-pact-engine.cjs tests/bramble-pact-dom.cjs
          python tests/assets.py
          python tests/selected-indie.py
