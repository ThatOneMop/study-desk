name: Scree Rider verification
on:
  push:
    branches: [indie-collection-three-dev]
    paths: ['games/scree-rider/**', 'tests/scree-rider-*', '.github/workflows/scree-rider-verification.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --prefix "$RUNNER_TEMP/qa" playwright@1.58.2
          node "$RUNNER_TEMP/qa/node_modules/playwright/cli.js" install --with-deps chromium
      - run: |
          export NODE_PATH="$RUNNER_TEMP/qa/node_modules"
          node --check games/scree-rider/game.js
          node --test tests/scree-rider-engine.cjs
          node tests/scree-rider-browser.cjs
          node tests/scree-rider-qualified.cjs
          python tests/assets.py
          python tests/selected-indie.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scree-rider-browser
          path: test-artifacts/scree-rider/
