name: Verify original indie candidates
on:
  push:
    branches: [indie-collection-dev]
    paths: ['dev/indie-collection/**', 'tests/tidepost-*', 'tests/spore-kitchen-*', 'tests/bolt-and-bristle-*', 'tests/queen-cinders-*', 'tests/inkline-*', 'tests/deep-pocket-*', 'tests/roof-runner-*', 'tests/scrap-orbit-*', 'tests/stone-song-*', 'tests/last-match-*', 'tests/glasshouse-*', 'tests/burrow-express-*', 'tests/little-foundry-*', 'tests/storm-signal-*', 'tests/circuit-garden-*', 'tests/pocket-expedition-*', 'tests/moss-market-*', 'tests/threadbound-*', 'tests/rain-catcher-*', 'tests/echo-vault-*', 'tests/indie-assets.py', '.github/workflows/indie-collection.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing repository asset gate
        run: python tests/assets.py
      - name: Candidate ledger, routes and syntax
        run: python tests/indie-assets.py
      - name: Engine progression and solvability
        run: |
          node tests/tidepost-engine.cjs
          node tests/spore-kitchen-engine.cjs
          node tests/bolt-and-bristle-engine.cjs
          node tests/queen-cinders-engine.cjs
          node tests/inkline-engine.cjs
          node tests/deep-pocket-engine.cjs
          node tests/roof-runner-engine.cjs
          node tests/scrap-orbit-engine.cjs
          node tests/stone-song-engine.cjs
          node tests/last-match-engine.cjs
          node tests/glasshouse-engine.cjs
          node tests/burrow-express-engine.cjs
          node tests/little-foundry-engine.cjs
          node tests/storm-signal-engine.cjs
          node tests/circuit-garden-engine.cjs
          node tests/pocket-expedition-engine.cjs
          node tests/moss-market-engine.cjs
          node tests/threadbound-engine.cjs
          node tests/rain-catcher-engine.cjs
          node tests/echo-vault-engine.cjs
      - name: Temporary browser test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/indie-tests" jsdom@26 playwright@1.62.1 --no-audit --no-fund
          node "$RUNNER_TEMP/indie-tests/node_modules/playwright/cli.js" install --with-deps chromium --only-shell
      - name: Interface and saved voyages
        run: |
          NODE_PATH="$RUNNER_TEMP/indie-tests/node_modules" node tests/tidepost-dom.cjs
          NODE_PATH="$RUNNER_TEMP/indie-tests/node_modules" node tests/spore-kitchen-dom.cjs
          NODE_PATH="$RUNNER_TEMP/indie-tests/node_modules" node tests/bolt-and-bristle-dom.cjs
          NODE_PATH="$RUNNER_TEMP/indie-tests/node_modules" node tests/queen-cinders-dom.cjs
          NODE_PATH="$RUNNER_TEMP/indie-tests/node_modules" node tests/inkline-dom.cjs
          NODE_PATH="$RUNNER_TEMP/indie-tests/node_modules" node tests/deep-pocket-dom.cjs
          NODE_PATH="$RUNNER_TEMP/indie-tests/node_modules" node tests/roof-runner-dom.cjs
          NODE_PATH="$RUNNER_TEMP/indie-tests/node_modules" node tests/scrap-orbit-dom.cjs
          NODE_PATH="$RUNNER_TEMP/indie-tests/node_modules" node tests/stone-song-dom.cjs
          NODE_PATH="$RUNNER_TEMP/indie-tests/node_modules" node tests/last-match-dom.cjs
          NODE_PATH="$RUNNER_TEMP/indie-tests/node_modules" node tests/glasshouse-dom.cjs
          NODE_PATH="$RUNNER_TEMP/indie-tests/node_modules" node tests/burrow-express-dom.cjs
          NODE_PATH="$RUNNER_TEMP/indie-tests/node_modules" node tests/little-foundry-dom.cjs
          NODE_PATH="$RUNNER_TEMP/indie-tests/node_modules" node tests/storm-signal-dom.cjs
          NODE_PATH="$RUNNER_TEMP/indie-tests/node_modules" node tests/circuit-garden-dom.cjs
          NODE_PATH="$RUNNER_TEMP/indie-tests/node_modules" node tests/pocket-expedition-dom.cjs
          NODE_PATH="$RUNNER_TEMP/indie-tests/node_modules" node tests/moss-market-dom.cjs
          NODE_PATH="$RUNNER_TEMP/indie-tests/node_modules" node tests/threadbound-dom.cjs
          NODE_PATH="$RUNNER_TEMP/indie-tests/node_modules" node tests/rain-catcher-dom.cjs
          NODE_PATH="$RUNNER_TEMP/indie-tests/node_modules" node tests/echo-vault-dom.cjs
      - name: Real desktop and touch browser checks
        run: |
          NODE_PATH="$RUNNER_TEMP/indie-tests/node_modules" node tests/tidepost-browser.cjs
          NODE_PATH="$RUNNER_TEMP/indie-tests/node_modules" node tests/spore-kitchen-browser.cjs
          NODE_PATH="$RUNNER_TEMP/indie-tests/node_modules" node tests/bolt-and-bristle-browser.cjs
          NODE_PATH="$RUNNER_TEMP/indie-tests/node_modules" node tests/queen-cinders-browser.cjs
          NODE_PATH="$RUNNER_TEMP/indie-tests/node_modules" node tests/inkline-browser.cjs
          NODE_PATH="$RUNNER_TEMP/indie-tests/node_modules" node tests/deep-pocket-browser.cjs
          NODE_PATH="$RUNNER_TEMP/indie-tests/node_modules" node tests/roof-runner-browser.cjs
          NODE_PATH="$RUNNER_TEMP/indie-tests/node_modules" node tests/scrap-orbit-browser.cjs
          NODE_PATH="$RUNNER_TEMP/indie-tests/node_modules" node tests/stone-song-browser.cjs
          NODE_PATH="$RUNNER_TEMP/indie-tests/node_modules" node tests/last-match-browser.cjs
          NODE_PATH="$RUNNER_TEMP/indie-tests/node_modules" node tests/glasshouse-browser.cjs
          NODE_PATH="$RUNNER_TEMP/indie-tests/node_modules" node tests/burrow-express-browser.cjs
          NODE_PATH="$RUNNER_TEMP/indie-tests/node_modules" node tests/little-foundry-browser.cjs
          NODE_PATH="$RUNNER_TEMP/indie-tests/node_modules" node tests/storm-signal-browser.cjs
          NODE_PATH="$RUNNER_TEMP/indie-tests/node_modules" node tests/circuit-garden-browser.cjs
          NODE_PATH="$RUNNER_TEMP/indie-tests/node_modules" node tests/pocket-expedition-browser.cjs
          NODE_PATH="$RUNNER_TEMP/indie-tests/node_modules" node tests/moss-market-browser.cjs
          NODE_PATH="$RUNNER_TEMP/indie-tests/node_modules" node tests/threadbound-browser.cjs
          NODE_PATH="$RUNNER_TEMP/indie-tests/node_modules" node tests/rain-catcher-browser.cjs
          NODE_PATH="$RUNNER_TEMP/indie-tests/node_modules" node tests/echo-vault-browser.cjs
      - name: Candidate visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indie-candidate-screenshots
          path: |
            /tmp/tidepost-*.png
            /tmp/bolt-and-bristle-*.png
            /tmp/queen-cinders-*.png
            /tmp/deep-pocket-*.png
            /tmp/roof-runner-*.png
            /tmp/scrap-orbit-*.png
            /tmp/stone-song-*.png
            /tmp/last-match-*.png
            /tmp/glasshouse-*.png
            /tmp/burrow-express-*.png
            /tmp/little-foundry-*.png
            /tmp/storm-signal-*.png
            /tmp/circuit-garden-*.png
            /tmp/pocket-expedition-*.png
            /tmp/moss-market-*.png
            /tmp/threadbound-*.png
            /tmp/rain-catcher-*.png
            /tmp/echo-vault-*.png
          if-no-files-found: ignore
