name: Canopy Weave candidate verification
on:
  push:
    branches: [indie-collection-three-dev]
    paths:
      - 'games/canopy-weave/**'
      - 'tests/canopy-weave*'
      - 'tests/fixtures/canopy-weave*'
      - '.github/workflows/canopy-weave-verification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  canopy-weave:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --prefix "$RUNNER_TEMP/qa" jsdom@26.1.0 playwright@1.58.2
          node "$RUNNER_TEMP/qa/node_modules/playwright/cli.js" install --with-deps chromium
      - run: |
          export NODE_PATH="$RUNNER_TEMP/qa/node_modules"
          node --check games/canopy-weave/game.js
          node --test tests/canopy-weave-engine.cjs tests/canopy-weave-dom.cjs
          node tests/canopy-weave-browser.cjs
          python tests/assets.py
          python tests/selected-indie.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canopy-weave-browser
          path: test-artifacts/canopy-weave/

