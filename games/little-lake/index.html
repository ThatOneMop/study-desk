function draw(){g.setTransform(c.width/960,0,0,c.height/600,0,0);rect(0,0,960,600,area.biome[1]);for(let j=0;j<50;j++){let x=(j*173+Math.sin(t*.3+j+area.seed)*10+t*area.wind)%960,y=(j*83)%600;rect(x,y,10+Math.sin(t+j)*4,1,'#81b6a04b');rect(x+3,y+3,14,1,'#1f595e44')}for(let j=0;j<14;j++){let x=300+(j*93)%570+Math.sin(t*.25+j)*20,y=120+(j*63)%380;fishSprite(x,y,'#1f515b55',.6)}

function castAt(x,y){if(modal)return;if(state==='bite'){state='reel';prog=.25;pos=.5;timer=0;$('reel').style.display='block';$('cast').textContent='Hold to reel';$('status').textContent='Easy does it.';beep(660);return}if(state!=='idle')return;if(save.bag.length>=capacity()){toast('Your creel is full. Sell your catch at the dock shop.');return}if(x!==undefined&&(x<190||y<105||(Math.hypot(x-area.island.x,(y-area.island.y)*1.8)<area.island.rx+15))){toast('Cast onto open water.');return}let dx=(x??player.x+70)-player.x,dy=(y??player.y+55)-player.y,len=Math.hypot(dx,dy),range=100+save.rod*25;if(len>range){dx*=range/len;dy*=range/len}bob={x:Math.max(195,Math.min(930,player.x+dx)),y:Math.max(110,Math.min(565,player.y+dy))};state='waiting';timer=1.8+Math.random()*2.8;let lucky=hotspots.some(s=>Math.hypot(s.x-bob.x,s.y-bob.y)<45);let roll=Math.random()+save.rod*.035+(lucky?.16:0);current=area.pool[roll>1.02?5:roll>.92?4:roll>.74?3:roll>.47?2:roll>.2?1:0];$('cast').textContent='Waiting…';$('status').textContent='Just you and the water.';$('hint').textContent='Wait for the bite, then press SPACE or Hook!';beep(330)}function idle(){state='idle';$('reel').style.display='none';$('cast').textContent='Cast a line ↗';$('status').textContent=area.name;$('hint').textContent=area.biome[0]+' · '+area.multiplier.toFixed(1)+'× value. Fish the ripples; sell at the dock.';held=false}function catchFish(){const weight=(.3+Math.random()*speciesDetails(current).weight),value=Math.round(fish[current][1]*(.8+weight*.15)*area.multiplier);save.bag.push({id:current,weight,value});if(!save.seen.includes(current))save.seen.push(current);save.caught++;persist();ui();toast(fish[current][0]+' · '+weight.toFixed(2)+' kg · '+money(value)+(current%6===5?' · LEGENDARY!':''));for(let i=0;i<22;i++)particles.push({x:bob.x,y:bob.y,vx:(Math.random()-.5)*75,vy:-Math.random()*80,life:1,color:fish[current][2]});beep(880);idle()}

function icon(id){const f=fish[id],d=speciesDetails(id),width=12+d.shape*3;let body=d.shape===3?'<path d="M10 12L23 2L36 12L23 22Z" fill="'+f[2]+'"/>':'<rect x="11" y="7" width="'+width+'" height="10" fill="'+f[2]+'"/>';return '<svg class="fishIcon" viewBox="0 0 45 26" role="img" aria-label="Fish silhouette"><path d="M4 5L14 12L4 20Z" fill="'+f[2]+'"/>'+body+'<rect x="'+(width+6)+'" y="9" width="2" height="2" fill="#183632"/>'+(d.pattern===1?'<path d="M17 7V17M22 7V17" stroke="#24433b" stroke-width="2"/>':d.pattern===2?'<path d="M16 10h2v2h-2zM22 13h2v2h-2z" fill="#fff3b5"/>':'')+'</svg>'}
function openPanel(kind){if(state!=='idle'){toast('Finish your cast first.');return}modal=true;keys={};held=false;$('modal').style.display='flex';if(kind==='journal'){renderJournal();return}if(kind==='atlas'){renderAtlas();return}let s=shell('Bait & bits','Sell a few fish. Buy a better rod. Find a new horizon.');s+='<div class="row"><div><b>Your catch</b><span class="sub">'+save.bag.length+' fish · worth '+money(save.bag.reduce((a,b)=>a+b.value,0))+'</span></div><button onclick="sell()" '+(!save.bag.length?'disabled':'')+'>Sell all</button></div>';for(const [key,title,desc,cost,max] of [['rod','Better rod','Wider reel zone, longer cast, rarer fish.',80*(save.rod+1)**2,4],['bagLevel','Bigger creel','Room for 6 more fish.',65*(save.bagLevel+1)**2,4]]){s+='<div class="row"><div><b>'+title+' · Lv '+save[key]+'</b><span class="sub">'+desc+'</span></div><button onclick="buy(\''+key+'\','+cost+')" '+(save.money<cost||save[key]>=max?'disabled':'')+'>'+(save[key]>=max?'Max':money(cost))+'</button></div>'}s+='<div class="row"><div><b>The world is bigger now.</b><span class="sub">'+(save.waters+1).toLocaleString()+' / 8,000,000 areas unlocked</span></div><button onclick="openPanel(\'atlas\')">Explore →</button></div>';$('sheet').innerHTML=s}
function renderJournal(){ $('sheet').innerHTML=shell('Your field notes',save.seen.length.toLocaleString()+' / 7,000 species discovered · '+save.caught.toLocaleString()+' fish caught')+'<div class="controls"><input id="fishSearch" placeholder="Search name or species number" aria-label="Search fish"><select id="fishFilter" aria-label="Filter fish"><option value="all">All species</option><option value="seen">Caught</option><option value="local">In this area</option></select></div><div id="fishResults"></div>';$('fishSearch').value=journalQuery;$('fishFilter').value=journalFilter;$('fishSearch').oninput=e=>{journalQuery=e.target.value;journalPage=0;renderFishResults()};$('fishFilter').onchange=e=>{journalFilter=e.target.value;journalPage=0;renderFishResults()};renderFishResults()}
function renderFishResults(){const q=journalQuery.toLowerCase().trim(),seen=new Set(save.seen),matches=fish.map((f,i)=>i).filter(i=>(!q||fish[i][0].toLowerCase().includes(q)||String(i+1)===q)&&(journalFilter==='all'||journalFilter==='seen'&&seen.has(i)||journalFilter==='local'&&area.pool.includes(i)));const pages=Math.max(1,Math.ceil(matches.length/24));journalPage=Math.max(0,Math.min(pages-1,journalPage));let s='<p class="sub">'+matches.length.toLocaleString()+' results · Page '+(journalPage+1)+' / '+pages+'</p>';for(const i of matches.slice(journalPage*24,journalPage*24+24)){const home=speciesHome(i);s+='<div class="row">'+icon(i)+'<div style="flex:1"><b>'+fish[i][0]+'</b><span class="sub">#'+(i+1)+' · '+(seen.has(i)?'Caught ✓':'Not caught yet')+' · '+['Common','Common','Uncommon','Rare','Epic','Legendary'][i%6]+'<br>First found: area '+(home+1).toLocaleString()+' · up to '+speciesDetails(i).weight.toFixed(1)+' kg</span></div><button onclick="travel('+home+')" '+(home>save.waters?'disabled':'')+'>Visit</button></div>'}if(!matches.length)s+='<p>No matching fish. Try a different search.</p>';s+='<div class="controls"><button onclick="journalPage--;renderFishResults()" '+(journalPage===0?'disabled':'')+'>← Previous</button><button onclick="journalPage++;renderFishResults()" '+(journalPage===pages-1?'disabled':'')+'>Next →</button></div>';$('fishResults').innerHTML=s}
function renderAtlas(){atlasPage=Math.max(0,Math.min(Math.floor((AREA_COUNT-1)/8),atlasPage));let s=shell('Eight million horizons','Seeded waters with different biomes, shorelines, islands, currents and fish. Areas are generated when visited.');s+='<div class="label">'+(save.waters+1).toLocaleString()+' / 8,000,000 UNLOCKED</div><div class="bar"><i style="width:'+Math.max(.1,(save.waters+1)/AREA_COUNT*100)+'%"></i></div><div class="controls"><input id="areaJump" type="number" min="1" max="8000000" placeholder="Area number (1–8,000,000)" aria-label="Area number"><button onclick="jumpAtlas()">Find</button><button onclick="atlasPage=Math.floor(zone/8);renderAtlas()">Current</button><button onclick="atlasPage=Math.floor(Math.min(AREA_COUNT-1,save.waters+1)/8);renderAtlas()">Frontier</button></div>';
if(save.waters<AREA_COUNT-1){s+='<div class="label">UNLOCK THE NEXT AREAS WITH YOUR CATCH EARNINGS</div><div class="controls">';for(const n of [1,10,100,1000,10000,100000]){const count=Math.min(n,AREA_COUNT-1-save.waters);if(n!==1&&count<n)continue;const cost=batchCost(count);s+='<button onclick="unlockBatch('+count+')" '+(save.money<cost?'disabled':'')+' title="Unlock '+count.toLocaleString()+' consecutive areas">+'+count.toLocaleString()+' · '+money(cost)+'</button>'}s+='</div><p class="sub">Catch values increase as you venture further. Travel between unlocked areas is free.</p>'}else s+='<p>Every area unlocked. The whole world is yours.</p>';
for(let i=atlasPage*8;i<Math.min(AREA_COUNT,atlasPage*8+8);i++){const a=areaAt(i);s+='<div class="row"><div><b>#'+(i+1).toLocaleString()+' · '+a.name+'</b><span class="sub">'+a.biome[0]+' · '+a.multiplier.toFixed(1)+'× catch value · '+a.spots.length+' fishing spots</span></div><button onclick="travel('+i+')" '+(i>save.waters+1?'disabled':'')+(i===save.waters+1&&save.money<batchCost(1)?'disabled':'')+'>'+(i===zone?'Here':i<=save.waters?'Travel':i===save.waters+1?money(batchCost(1)):'Locked')+'</button></div>'}s+='<div class="controls"><button onclick="atlasPage--;renderAtlas()" '+(atlasPage===0?'disabled':'')+'>← Previous</button><span class="sub">Page '+(atlasPage+1).toLocaleString()+' / 1,000,000</span><button onclick="atlasPage++;renderAtlas()" '+(atlasPage===999999?'disabled':'')+'>Next →</button></div>';$('sheet').innerHTML=s}
function jumpAtlas(){const n=Number($('areaJump').value);if(!Number.isInteger(n)||n<1||n>AREA_COUNT){toast('Choose an area from 1 to 8,000,000.');return}atlasPage=Math.floor((n-1)/8);renderAtlas()}
function unlockBatch(n){if(!Number.isInteger(n)||n<1||save.waters+n>=AREA_COUNT)return;const cost=batchCost(n);if(save.money<cost)return;save.money-=cost;save.waters+=n;persist();ui();atlasPage=Math.floor(save.waters/8);renderAtlas();toast(n.toLocaleString()+' new areas unlocked!');beep(700)}
function closePanel(){modal=false;$('modal').style.display='none'}
function sell(){save.money+=save.bag.reduce((a,b)=>a+b.value,0);save.bag=[];persist();ui();beep(700);openPanel('shop')}
function buy(key,cost){if(!['rod','bagLevel'].includes(key))return;const expected=(key==='rod'?80:65)*(save[key]+1)**2;if(cost!==expected||save.money<cost||save[key]>=4)return;save.money-=cost;save[key]++;persist();ui();openPanel('shop');beep(600)}
function travel(i){if(!Number.isInteger(i)||i<0||i>=AREA_COUNT||state!=='idle')return;if(i>save.waters){if(i!==save.waters+1)return;const cost=batchCost(1);if(save.money<cost)return;save.money-=cost;save.waters=i}zone=i;area=areaAt(i);hotspots=area.spots;save.area=i;player={x:450,y:290};wake=[];particles=[];persist();ui();closePanel();toast('Welcome to '+area.name)}
$('atlas').onclick=()=>{atlasPage=Math.floor(zone/8);openPanel('atlas')};
$('shop').onclick=()=>openPanel('shop');$('journal').onclick=()=>openPanel('journal');$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'♪ on':'♪ off';beep()};$('modal').onclick=e=>{if(e.target===$('modal'))closePanel()};$('cast').onpointerdown=e=>{e.preventDefault();if(state==='reel')held=true;else castAt()};window.addEventListener('pointerup',()=>{held=false;keys={}});c.onpointerdown=e=>{const r=c.getBoundingClientRect();castAt((e.clientX-r.left)/r.width*960,(e.clientY-r.top)/r.height*600)};window.onkeydown=e=>{if(['INPUT','SELECT','TEXTAREA'].includes(e.target?.tagName))return;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();keys[e.key.toLowerCase()]=true;if(e.code==='Space'&&!e.repeat){if(state==='reel')held=true;else castAt()}if(e.key==='Escape')closePanel();if(e.key.toLowerCase()==='e')openPanel('shop')};window.onkeyup=e=>{keys[e.key.toLowerCase()]=false;if(e.code==='Space')held=false};window.onblur=()=>{keys={};held=false};document.querySelectorAll('[data-key]').forEach(b=>{b.onpointerdown=e=>{e.preventDefault();keys[b.dataset.key]=true};b.onpointerup=()=>keys[b.dataset.key]=false;b.onpointercancel=()=>keys[b.dataset.key]=false});function resize(){c.width=960;c.height=600}resize();ui();
function frame(now){dt=Math.min((now-last)/1000,.04)||.016;last=now;t+=dt;if(!modal){if(state==='idle'){let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0),len=Math.hypot(dx,dy)||1;let nx=Math.max(220,Math.min(920,player.x+dx/len*100*dt)),ny=Math.max(125,Math.min(545,player.y+dy/len*100*dt));if(Math.hypot(nx-area.island.x,(ny-area.island.y)*1.8)>area.island.rx+30){player.x=nx;player.y=ny}if((dx||dy)&&Math.random()<.15)wake.push({x:player.x,y:player.y+20,life:1})}else if(state==='waiting'){timer-=dt;if(timer<=0){state='bite';timer=2.4;$('cast').textContent='Hook!';$('status').textContent='You have a bite!';beep(990)}}else if(state==='bite'){timer-=dt;if(timer<=0){idle();toast('That one got away. Cast again!')}}else if(state==='reel'){timer+=dt;pos=Math.max(0,Math.min(1,pos+(held?.48:-.33)*dt));target=.5+Math.sin(timer*speciesDetails(current).speed)*.25+Math.sin(timer*2.1)*.08;let width=.28+save.rod*.035;let inside=Math.abs(pos-target)<width/2;prog+=dt*(inside?.23:-.13);$('zone').style.left=(target-width/2)*100+'%';$('zone').style.width=width*100+'%';$('needle').style.left=pos*100+'%';$('progress').style.width=Math.max(0,prog)*100+'%';$('reelLabel').textContent=inside?'NICE & STEADY…':'KEEP THE MARKER IN THE GREEN';if(prog>=1)catchFish();else if(prog<=0){idle();toast('The fish slipped the hook. Try a gentle hold and release.')}}}wake.forEach(a=>a.life-=dt*.6);wake=wake.filter(a=>a.life>0);particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=100*dt;p.life-=dt});particles=particles.filter(p=>p.life>0);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);toast('7,000 species. 8 million horizons. Your next adventure starts here.');
</script></body></html>
