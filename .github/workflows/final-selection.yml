name: Final selection integration
on:
  push:
    branches: [indie-final-selection]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --prefix "$RUNNER_TEMP/qa" playwright@1.58.2 jsdom
          node "$RUNNER_TEMP/qa/node_modules/playwright/cli.js" install --with-deps chromium
      - run: |
          export NODE_PATH="$RUNNER_TEMP/qa/node_modules"
          node tests/curation-regression.cjs
          python tests/selected-indie.py
          python tests/assets.py
          node tests/final-selection-launcher.cjs
          STUDY_DESK_URL=https://thatonemop.github.io/study-desk node tests/final-selection-launcher.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-selection
          path: test-artifacts/final-selection*/
