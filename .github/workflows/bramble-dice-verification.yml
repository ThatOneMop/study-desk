name: Bramble Dice candidate verification
on:
  push:
    branches: [indie-collection-three-dev]
    paths:
      - 'games/bramble-dice/**'
      - 'tests/bramble-dice*'
      - '.github/workflows/bramble-dice-verification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bramble-dice:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --prefix "$RUNNER_TEMP/qa" jsdom@26.1.0 playwright@1.58.2
          node "$RUNNER_TEMP/qa/node_modules/playwright/cli.js" install --with-deps chromium
      - run: |
          export NODE_PATH="$RUNNER_TEMP/qa/node_modules"
          node --check games/bramble-dice/game.js
          node --test tests/bramble-dice-engine.cjs tests/bramble-dice-dom.cjs
          node tests/bramble-dice-browser.cjs
          python tests/assets.py
          python tests/selected-indie.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bramble-dice-browser
          path: test-artifacts/bramble-dice/
