name: Verify original indie candidates
on:
  push:
    branches: [indie-collection-dev]
    paths: ['dev/indie-collection/**', 'tests/tidepost-*', 'tests/spore-kitchen-*', 'tests/indie-assets.py', '.github/workflows/indie-collection.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing repository asset gate
        run: python tests/assets.py
      - name: Candidate ledger, routes and syntax
        run: python tests/indie-assets.py
      - name: Engine progression and solvability
        run: |
          node tests/tidepost-engine.cjs
          node tests/spore-kitchen-engine.cjs
      - name: Temporary browser test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/indie-tests" jsdom@26 playwright@1.62.1 --no-audit --no-fund
          node "$RUNNER_TEMP/indie-tests/node_modules/playwright/cli.js" install --with-deps chromium --only-shell
      - name: Interface and saved voyages
        run: |
          NODE_PATH="$RUNNER_TEMP/indie-tests/node_modules" node tests/tidepost-dom.cjs
          NODE_PATH="$RUNNER_TEMP/indie-tests/node_modules" node tests/spore-kitchen-dom.cjs
      - name: Real desktop and touch browser checks
        run: |
          NODE_PATH="$RUNNER_TEMP/indie-tests/node_modules" node tests/tidepost-browser.cjs
          NODE_PATH="$RUNNER_TEMP/indie-tests/node_modules" node tests/spore-kitchen-browser.cjs
