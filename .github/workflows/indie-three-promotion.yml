name: Third collection catalogue promotion
on:
  push:
    branches: [indie-three-promotion]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  moss-commons-catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --prefix "$RUNNER_TEMP/qa" jsdom@26.1.0 playwright@1.58.2
          node "$RUNNER_TEMP/qa/node_modules/playwright/cli.js" install --with-deps chromium
      - run: |
          export NODE_PATH="$RUNNER_TEMP/qa/node_modules"
          node --test tests/moss-commons-engine.cjs tests/moss-commons-dom.cjs
          node tests/moss-commons-browser.cjs
          node tests/moss-commons-catalog-browser.cjs
          node --test tests/soundings-engine.cjs tests/soundings-dom.cjs
          node tests/soundings-browser.cjs
          node tests/soundings-catalog-browser.cjs
          node --test tests/tumbleglass-engine.cjs tests/tumbleglass-dom.cjs
          node tests/tumbleglass-browser.cjs
          node tests/tumbleglass-catalog-browser.cjs
          node --test tests/beepline-engine.cjs tests/beepline-dom.cjs
          node tests/beepline-browser.cjs
          node tests/beepline-catalog-browser.cjs
          node --test tests/reedbreaker-engine.cjs tests/reedbreaker-dom.cjs
          node tests/reedbreaker-browser.cjs
          node tests/reedbreaker-catalog-browser.cjs
          node --test tests/needlepath-engine.cjs tests/needlepath-dom.cjs
          node tests/needlepath-browser.cjs
          node tests/needlepath-catalog-browser.cjs
          node --test tests/bramble-dice-engine.cjs tests/bramble-dice-dom.cjs
          node tests/bramble-dice-browser.cjs
          node tests/bramble-dice-catalog-browser.cjs
          node --check games/stencil-studio/game.js
          node --check games/stencil-studio/engine.js
          node --test tests/stencil-studio-engine.cjs tests/stencil-studio-dom.cjs
          node tests/curation-regression.cjs
          node tests/active-credits.cjs
          node tests/catalog-launch.cjs
          node tests/launcher-navigation.cjs
          node tests/relaxed-collection.cjs
          node --check games/moon-dial/game.js
          node --test tests/moon-dial-engine.cjs tests/moon-dial-dom.cjs
          node tests/moon-dial-browser.cjs
          node tests/moon-dial-catalog-browser.cjs
          node tests/stencil-studio-browser.cjs
          node tests/stencil-studio-catalog-browser.cjs
          node --check games/pebble-rink/game.js
          node --test tests/pebble-rink-engine.cjs tests/pebble-rink-dom.cjs
          node tests/pebble-rink-browser.cjs
          node tests/pebble-rink-catalog-browser.cjs
          node --check games/pocket-regatta/game.js
          node --test tests/pocket-regatta-engine.cjs tests/pocket-regatta-dom.cjs
          node tests/pocket-regatta-browser.cjs
          node tests/pocket-regatta-catalog-browser.cjs
          node --test tests/crate-cushion-engine.cjs tests/crate-cushion-dom.cjs
          node tests/crate-cushion-browser.cjs
          node tests/crate-cushion-catalog-browser.cjs
          python tests/assets.py
          python tests/selected-indie.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moss-commons-catalogue-browser
          path: |
            test-artifacts/stencil-studio/
            test-artifacts/stencil-catalog/
            test-artifacts/moon-dial/
            test-artifacts/moon-catalog/

            test-artifacts/pebble-rink/
            test-artifacts/pebble-catalog/

            test-artifacts/pocket-regatta/
            test-artifacts/regatta-catalog/

            test-artifacts/crate-cushion/
            test-artifacts/crate-catalog/

            test-artifacts/bramble-dice/
            test-artifacts/bramble-catalog/
            test-artifacts/needlepath/
            test-artifacts/needle-catalog/
            test-artifacts/reedbreaker/
            test-artifacts/reed-catalog/
            test-artifacts/beepline/
            test-artifacts/bee-catalog/

            test-artifacts/tumbleglass/
            test-artifacts/tumbleglass-catalog/
            test-artifacts/soundings/
            test-artifacts/soundings-catalog/

            test-artifacts/moss-commons/
            test-artifacts/moss-commons-catalog/
