name: Fallow Table catalogue promotion
on:
  push:
    branches: [fallow-table-release]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fallow-table-catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --prefix "$RUNNER_TEMP/qa" jsdom@26.1.0 playwright@1.58.2
          node "$RUNNER_TEMP/qa/node_modules/playwright/cli.js" install --with-deps chromium
      - run: |
          export NODE_PATH="$RUNNER_TEMP/qa/node_modules"
          node --test tests/fallow-table-engine.cjs tests/fallow-table-dom.cjs
          node tests/fallow-table-browser.cjs
          node tests/fallow-table-catalog-browser.cjs
          node tests/curation-regression.cjs
          node tests/active-credits.cjs
          node tests/catalog-launch.cjs
          node tests/launcher-navigation.cjs
          node tests/relaxed-collection.cjs
          python tests/assets.py
          python tests/selected-indie.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fallow-table-catalogue-browser
          path: |
            test-artifacts/fallow-table/
            test-artifacts/fallow-table-catalog/
