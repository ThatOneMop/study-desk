name: Second collection promotion regression
on:
  push:
    branches: [indie-two-promotion]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hollow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          python tests/assets.py
          python tests/selected-indie.py
          npm install --prefix "$RUNNER_TEMP/qa" jsdom@26.1.0 playwright@1.58.2
          node "$RUNNER_TEMP/qa/node_modules/playwright/cli.js" install --with-deps chromium
      - run: |
          export NODE_PATH="$RUNNER_TEMP/qa/node_modules"
          node --test tests/hollow-keeper-engine.cjs tests/hollow-keeper-dom.cjs
          node tests/curation-regression.cjs
          node tests/hollow-keeper-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: merged-hollow-browser
          path: test-artifacts/
