name: Second indie collection regression
on:
  push:
    branches: [indie-collection-two-dev]
    paths:
      - 'games/reefwright/**'
      - 'games/counterweight/**'
      - 'games/lanternwake/**'
      - 'games/copper-cadence/**'
      - 'games/hollow-keeper/**'
      - 'games/paper-odyssey/**'
      - 'games/cairn-and-cord/**'
      - 'tests/cairn-and-cord-*'
      - 'games/tea-for-ghosts/**'
      - 'tests/tea-for-ghosts-*'
      - 'games/borrowed-gravity/**'
      - 'tests/borrowed-gravity-*'
      - 'tests/fixtures/borrowed-gravity-*'
      - 'games/static-orchard/**'
      - 'tests/static-orchard-*'
      - 'games/pocket-palaeo/**'
      - 'tests/pocket-palaeo-*'
      - 'tests/fixtures/pocket-palaeo-*'
      - 'games/salt-and-sail/**'
      - 'tests/salt-and-sail-*'
      - 'tests/fixtures/salt-and-sail-*'
      - 'games/wellward/**'
      - 'tests/wellward-*'
      - 'tests/fixtures/wellward-*'
      - 'games/ratchet-run/**'
      - 'tests/ratchet-run-*'
      - 'tests/fixtures/ratchet-run-*'
      - 'tests/paper-odyssey-*'
      - 'tests/fixtures/paper-odyssey-*'
      - 'tests/hollow-keeper-*'
      - 'tests/fixtures/hollow-keeper-*'
      - 'tests/copper-cadence-*'
      - 'tests/fixtures/copper-cadence-*'
      - 'tests/lanternwake-*'
      - 'tests/fixtures/lanternwake-*'
      - 'tests/counterweight-*'
      - 'tests/fixtures/counterweight-*'
      - 'dev/indie-collection-two/**'
      - 'tests/reefwright-*'
      - 'tests/fixtures/reefwright-*'
      - 'tests/indie-two-gate.py'
      - '.github/workflows/indie-two.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: indie-two-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve public routes and first-batch source hashes
        run: |
          python tests/assets.py
          python tests/selected-indie.py
          python tests/indie-two-gate.py
          node --check games/reefwright/engine.js
          node --check games/reefwright/game.js
          node --check games/counterweight/engine.js
          node --check games/counterweight/game.js
          node --check games/lanternwake/engine.js
          node --check games/lanternwake/game.js
          node --check games/copper-cadence/engine.js
          node --check games/copper-cadence/game.js
          node --check games/hollow-keeper/engine.js
          node --check games/hollow-keeper/game.js
          node --check games/paper-odyssey/engine.js
          node --check games/paper-odyssey/game.js
          node --check games/ratchet-run/engine.js
          node --check games/ratchet-run/game.js
          node --check games/wellward/engine.js
          node --check games/wellward/game.js
          node --check games/salt-and-sail/engine.js
          node --check games/salt-and-sail/game.js
          node --check games/cairn-and-cord/engine.js
          node --check games/cairn-and-cord/game.js
          node --check games/tea-for-ghosts/engine.js
          node --check games/tea-for-ghosts/game.js
          node --check games/borrowed-gravity/engine.js
          node --check games/borrowed-gravity/game.js
          node --check games/static-orchard/engine.js
          node --check games/static-orchard/game.js
          node --check games/pocket-palaeo/engine.js
          node --check games/pocket-palaeo/game.js
      - name: Engine and full campaign checks
        run: node --test tests/reefwright-engine.cjs tests/counterweight-engine.cjs tests/lanternwake-engine.cjs tests/copper-cadence-engine.cjs tests/hollow-keeper-engine.cjs tests/paper-odyssey-engine.cjs tests/ratchet-run-engine.cjs tests/wellward-engine.cjs tests/salt-and-sail-engine.cjs tests/pocket-palaeo-engine.cjs tests/static-orchard-engine.cjs tests/borrowed-gravity-engine.cjs tests/tea-for-ghosts-engine.cjs tests/cairn-and-cord-engine.cjs
      - name: Install test-only dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/reef-deps" jsdom@26.1.0
      - name: DOM, persistence and input checks
        run: NODE_PATH="$RUNNER_TEMP/reef-deps/node_modules" node --test tests/reefwright-dom.cjs tests/counterweight-dom.cjs tests/lanternwake-dom.cjs tests/copper-cadence-dom.cjs tests/hollow-keeper-dom.cjs tests/paper-odyssey-dom.cjs tests/ratchet-run-dom.cjs tests/wellward-dom.cjs tests/salt-and-sail-dom.cjs tests/pocket-palaeo-dom.cjs tests/static-orchard-dom.cjs tests/borrowed-gravity-dom.cjs tests/tea-for-ghosts-dom.cjs tests/cairn-and-cord-dom.cjs
  browsers:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - group: new-games
            games: cairn-and-cord tea-for-ghosts borrowed-gravity static-orchard
          - group: motion
            games: wellward ratchet-run
          - group: planning
            games: reefwright counterweight lanternwake copper-cadence hollow-keeper paper-odyssey
          - group: craft-and-cargo
            games: pocket-palaeo salt-and-sail
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install native-browser test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-deps" playwright@1.58.2
          node "$RUNNER_TEMP/browser-deps/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Complete desktop and touch campaigns
        env:
          GAMES: ${{ matrix.games }}
        run: |
          for game in $GAMES; do
            NODE_PATH="$RUNNER_TEMP/browser-deps/node_modules" node "tests/$game-browser.cjs"
          done
      - name: Preserve browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: second-batch-browser-${{ matrix.group }}
          path: test-artifacts/
          if-no-files-found: warn
