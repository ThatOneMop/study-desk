name: Foldlight verification
on:
  push:
    branches: [indie-collection-three-dev]
    paths: ['games/foldlight/**', 'tests/foldlight-*.cjs', '.github/workflows/foldlight-verification.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --prefix "$RUNNER_TEMP/qa" jsdom@26.1.0 playwright@1.58.2
          node "$RUNNER_TEMP/qa/node_modules/playwright/cli.js" install --with-deps chromium
      - run: |
          export NODE_PATH="$RUNNER_TEMP/qa/node_modules"
          node --check games/foldlight/game.js
          node --test tests/foldlight-engine.cjs tests/foldlight-dom.cjs
          node tests/foldlight-browser.cjs
          python tests/assets.py
          python tests/selected-indie.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foldlight-browser
          path: test-artifacts/foldlight/
