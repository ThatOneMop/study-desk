name: Bellwether catalogue promotion
on:
  push:
    branches: [indie-three-bellwether-promotion-20261101]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bellwether-catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --prefix "$RUNNER_TEMP/qa" jsdom@26.1.0 playwright@1.58.2
          node "$RUNNER_TEMP/qa/node_modules/playwright/cli.js" install --with-deps chromium
      - run: |
          export NODE_PATH="$RUNNER_TEMP/qa/node_modules"
          node --test tests/bellwether-engine.cjs tests/bellwether-dom.cjs tests/ribbon-reef-engine.cjs tests/ribbon-reef-dom.cjs
          node tests/bellwether-browser.cjs
          node tests/bellwether-catalog-browser.cjs
          node tests/ribbon-reef-browser.cjs
          node tests/ribbon-reef-catalog-browser.cjs
          node tests/curation-regression.cjs
          node tests/active-credits.cjs
          node tests/catalog-launch.cjs
          node tests/launcher-navigation.cjs
          node tests/relaxed-collection.cjs
          python tests/assets.py
          python tests/selected-indie.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bellwether-catalogue-browser
          path: |
            test-artifacts/bellwether/
            test-artifacts/bellwether-catalog/
            test-artifacts/ribbon-reef/
            test-artifacts/ribbon-reef-catalog/
