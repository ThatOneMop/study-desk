name: Moon Dial candidate verification
on:
  push:
    branches: [indie-collection-three-dev]
    paths:
      - 'games/moon-dial/**'
      - 'tests/moon-dial*'
      - '.github/workflows/moon-dial-verification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  moon-dial:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --prefix "$RUNNER_TEMP/qa" jsdom@26.1.0 playwright@1.58.2
          node "$RUNNER_TEMP/qa/node_modules/playwright/cli.js" install --with-deps chromium
      - run: |
          export NODE_PATH="$RUNNER_TEMP/qa/node_modules"
          node --check games/moon-dial/game.js
          node --test tests/moon-dial-engine.cjs tests/moon-dial-dom.cjs
          node tests/moon-dial-browser.cjs
          python tests/assets.py
          python tests/selected-indie.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moon-dial-browser
          path: test-artifacts/moon-dial/
